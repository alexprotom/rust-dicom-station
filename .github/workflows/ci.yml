name: CI

# Pull requests, plus one build on `main` that exists only to fill the cache.
#
# A pull request check does not build your branch: GitHub checks out
# `refs/pull/N/merge`, your head already merged into the base. So by the time
# the PR is green, the exact tree that will land on main has been tested, and
# running the same tests again on the push that lands it is the same work
# twice. Branch protection is what makes that safe - nothing reaches main
# except through a checked pull request - together with "require branches to
# be up to date", which closes the one gap by forcing a re-check whenever the
# base moves underneath an open PR.
#
# The push to `main` therefore runs no tests. It compiles what the pull
# request jobs compile and saves that as the cache, because of where GitHub
# lets a run look for one: its own ref, its base branch and the default
# branch. A cache saved by a pull request lives under `refs/pull/N/merge` and
# is invisible to every other pull request, so each new PR used to start from
# nothing - 25 to 31 minutes for the first run, 11 to 17 for the next push to
# the same PR. A cache on `main` is visible to all of them, so every PR starts
# warm. Only `main` saves (`save-if` below): a PR restores and never writes,
# which also keeps these caches from crowding the release and platform ones
# out of the repository's 10 GB.
#
# `workflow_dispatch` stays as the manual way to run the whole thing against
# any branch.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Why this file is a handful of small jobs rather than one long one.
#
# Cargo shares compiled dependencies between commands only when the *feature
# set* and the *mode* match. `--no-default-features` and `--features mcp`
# each change the features of crates deep in the graph and so build much of
# it again; and `cargo clippy` only type-checks (it writes metadata, no
# machine code), so it cannot reuse what `cargo test` compiled and the other
# way round. Several graphs in one job are several graphs one after the
# other; in separate jobs they build at once, and the wall clock becomes the
# longest of them instead of their sum. Each job also gets its own cache, so
# a cache holds one graph and is quick to save and restore.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental compilation only pays off across edits of the same working
  # copy; in CI it is written once, never read, and costs disk and time.
  CARGO_INCREMENTAL: 0
  # Debug info is most of the link time and most of the cache. Nothing here
  # opens a debugger, and a backtrace still names the functions.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # On a push to main the test steps compile and stop (see the top).
  NO_RUN: ${{ github.event_name == 'push' && '--no-run' || '' }}

jobs:
  # Formatting and lints of the default feature set. Platform-independent, so
  # they run once, on Linux.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # eframe/winit need X11, Wayland and xkbcommon headers to build on Linux.
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  # The one thing the Linux lint job cannot see: code behind `cfg(windows)`
  # and `cfg(target_os = "macos")` - the Metal arm of src/gfx.rs, the
  # Application Support paths in src/settings.rs. This used to be a step in
  # the test jobs, but clippy's type-check shares nothing with the test
  # build (see the top), so there it was a whole second graph in front of the
  # tests - 1 to 1.5 minutes warm and 8.5 cold on Windows, on the job every
  # pull request waits for. Here it runs alongside them.
  clippy-platform:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # With the PACS server: it ships on both, and it is the one part of
      # the code base that only these two would otherwise first compile at
      # release time. Features add, so the default build is checked as well.
      - name: cargo clippy
        run: cargo clippy --features pacs-server --all-targets -- -D warnings

  # The test suite, on all three desktop platforms.
  #
  # Linux runs it with the default features, `gpu` included. Windows and
  # macOS run it without them (`--no-default-features`, the CPU-only build).
  # No test drives the wgpu backend - the GPU agreement tests are #[ignore]d,
  # see below - so this runs the same tests, but the `gpu` feature makes
  # burn's wgpu/cubecl kernels part of the build, and they were well over
  # half of what it compiled: measured before the engines became their own
  # crate, the library went from 448 s to 184 s of compile time and its
  # unit-test build from 363 s to 130 s. That compile is most of the Windows
  # job, the one every pull request waited for. The GPU build itself is
  # still compiled on every platform, by clippy above, and tested here on
  # Linux.
  #
  # `--lib --bins --tests` rather than everything: that would also link
  # every example (ten large executables, the lint jobs already type-check
  # them) and hand the library to rustdoc for doc tests, of which there are
  # none.
  #
  # The runner is cargo-nextest (.config/nextest.toml): each test is its own
  # process and all suites run at once, where `cargo test` runs the test
  # binaries one after another - the MedSAM2 suite's forward passes, the
  # workflow runs and the registrations overlap instead of queueing.
  # `cargo test` itself is unchanged for local use. The engines crate
  # (crates/rds-engines) and the core crate are default members of the
  # workspace, so their unit tests run here too.
  #
  # macOS runs on the Apple Silicon image and needs no system packages - the
  # window stack is Metal and AppKit, which come with the SDK. The Intel
  # half of the release is a cross-compilation and is checked by macos.yml;
  # nothing about this repository's code differs between the two.
  #
  # The GPU agreement test is #[ignore]d on purpose: runners expose a
  # *software* adapter (Mesa's lavapipe on Linux, WARP on Windows), and
  # driving twelve transformer blocks through a rasterizer takes minutes and
  # proves nothing about the backend.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        include:
          - os: ubuntu-latest
            features: ""
          - os: windows-latest
            features: --no-default-features
          - os: macos-15
            features: --no-default-features
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: cargo nextest
        run: cargo nextest run ${{ matrix.features }} --lib --bins --tests ${{ env.NO_RUN }}

  # The pure-CPU build the README documents: the GPU inference backend is
  # behind the default `gpu` feature. The Windows and macOS test jobs build
  # and run this configuration; this job adds what they leave out, the
  # examples, for which a type-check is enough.
  cpu-only:
    name: check (CPU only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo check (CPU only)
        run: cargo check --no-default-features --all-targets

  # The MCP server (`rds-mcp`) and its three suites live behind the `mcp`
  # feature so the viewer's build never links the protocol stack. Clippy
  # checks it with the default features, as it ships; the suites run in the
  # CPU-only build, for the reason given at the test job - nothing they do
  # touches the GPU, and the build is less than half the size.
  mcp:
    name: mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy (mcp)
        run: cargo clippy --features mcp --all-targets -- -D warnings

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: cargo nextest (mcp)
        run: cargo nextest run --no-default-features --features mcp --test workflow --test mcp_tools --test mcp_phi ${{ env.NO_RUN }}

  # The PACS server (`rds-pacs`) and its two suites live behind the
  # `pacs-server` feature, as the MCP server lives behind `mcp`: the viewer's
  # build carries only the client side. Clippy checks it with the default
  # features, as it ships; the suites run in the CPU-only build. They start
  # real servers on loopback ports (TLS, pairing, roles, the mirror, a task
  # run) and need nothing from outside.
  pacs:
    name: pacs server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy (pacs-server)
        run: cargo clippy --features pacs-server --all-targets -- -D warnings

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: cargo nextest (pacs-server)
        run: cargo nextest run --no-default-features --features pacs-server --test pacs_server --test pacs_mirror ${{ env.NO_RUN }}

  # The Windows installer is a separate workspace and is never built by
  # `cargo build` in the repository root, so it needs its own job. It is
  # Windows-only by construction (`compile_error!` on other targets).
  installer:
    name: installer (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packaging/windows/installer
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packaging/windows/installer
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Default features include `prefetch-models`, which pulls the viewer in
      # as a path dependency for the weight-download code.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # A debug build, not a release one: what this proves is that the crate
      # compiles and links. (It does not reuse what clippy just checked -
      # see the top - but the cache keeps both.) The optimised installer is
      # built by the release workflow, which is the only place its size and
      # speed matter.
      #
      # One configuration, not two: the default feature set pulls the whole
      # viewer in as a path dependency, so building both means two copies of
      # burn and wgpu on a runner with ~9 GB free. The standalone
      # configuration is type-checked instead.
      - name: cargo build (default)
        run: cargo build

      - name: cargo check (standalone, no model prefetch)
        run: cargo check --no-default-features
