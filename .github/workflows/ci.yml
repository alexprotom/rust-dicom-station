name: CI

# Pull requests only, deliberately.
#
# A pull request check does not build your branch: GitHub checks out
# `refs/pull/N/merge`, your head already merged into the base. So by the time
# the PR is green, the exact tree that will land on main has been tested, and
# running the same jobs again on the push that lands it is the same work
# twice. Branch protection is what makes that safe - nothing reaches main
# except through a checked pull request - together with "require branches to
# be up to date", which closes the one gap by forcing a re-check whenever the
# base moves underneath an open PR.
#
# `workflow_dispatch` stays as the manual way to run the whole thing against
# any branch.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Why this file is a handful of small jobs rather than one long one.
#
# Cargo shares compiled dependencies between commands only when the *feature
# set* matches: `cargo clippy` and `cargo test` reuse each other's work, but
# `--no-default-features` and `--features mcp` each build the dependency graph
# again from nothing. Three graphs in one job are three graphs one after the
# other; three graphs in three jobs are three graphs at once, and the wall
# clock becomes the longest of them instead of their sum. Each job also gets
# its own cache, so a cache holds one graph rather than three and is quick to
# save and restore.
#
# Nothing is checked less than before: every command below was already run.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental compilation only pays off across edits of the same working
  # copy; in CI it is written once, never read, and costs disk and time.
  CARGO_INCREMENTAL: 0
  # Debug info is most of the link time and most of the cache. Nothing here
  # opens a debugger, and a backtrace still names the functions.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Formatting and lints of the default feature set. Platform-independent, so
  # they run once, on Linux.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # eframe/winit need X11, Wayland and xkbcommon headers to build on Linux.
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  # The test suite, on both platforms. Windows gets its own clippy pass here
  # rather than a job of its own: it shares this job's dependency graph, so it
  # costs the workspace crate and nothing else.
  #
  # The GPU agreement test is #[ignore]d on purpose: runners expose a
  # *software* adapter (Mesa's lavapipe on Linux, WARP on Windows), and
  # driving twelve transformer blocks through a rasterizer takes minutes and
  # proves nothing about the backend.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      # The one thing the Linux lint job cannot see: code behind
      # `cfg(windows)`.
      - name: cargo clippy (windows-only code)
        if: runner.os == 'Windows'
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  # The pure-CPU build the README documents: the GPU inference backend is
  # behind the default `gpu` feature. Its own dependency graph, so its own
  # job. Feature wiring does not vary by platform.
  cpu-only:
    name: check (CPU only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (CPU only)
        run: cargo check --no-default-features --all-targets

  # The MCP server (`rds-mcp`) and its three suites live behind the `mcp`
  # feature so the viewer's build never links the protocol stack. Same
  # dependency graph as the default build plus a few small crates, but Cargo
  # builds it separately all the same - hence a job of its own.
  mcp:
    name: mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy (mcp)
        run: cargo clippy --features mcp --all-targets -- -D warnings

      - name: cargo test (mcp)
        run: cargo test --features mcp --test workflow --test mcp_tools --test mcp_phi

  # The Windows installer is a separate workspace and is never built by
  # `cargo build` in the repository root, so it needs its own job. It is
  # Windows-only by construction (`compile_error!` on other targets).
  installer:
    name: installer (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Default features include `prefetch-models`, which pulls the viewer in
      # as a path dependency for the weight-download code.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # A debug build, not a release one: what this proves is that the crate
      # compiles and links, and it shares the dependencies clippy just built.
      # The optimised installer is built by the release workflow, which is the
      # only place its size and speed matter.
      #
      # One configuration, not two: the default feature set pulls the whole
      # viewer in as a path dependency, so building both means two copies of
      # burn and wgpu on a runner with ~9 GB free. The standalone
      # configuration is type-checked instead.
      - name: cargo build (default)
        run: cargo build

      - name: cargo check (standalone, no model prefetch)
        run: cargo check --no-default-features
