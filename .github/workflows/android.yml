name: Android

# The Android package: the viewer as a shared library for arm64-v8a, wrapped
# in an APK by packaging/android/build-apk.sh (docs/android.md).
#
# Four ways in:
#   * a pull request into develop or main that touches the viewer's sources
#     or the packaging/android/ crate: `cargo ndk check` of the Android
#     crate, which is the cross-compilation proof and takes a fraction of a
#     release build. It is a job of its own here rather than a step of
#     ci.yml because it is a fourth dependency graph, and one graph per job
#     is what keeps CI fast.
#   * Actions > Android > Run workflow: a full APK of any branch, attached to
#     the run as the `android-apk` artifact.
#   * the release workflow calls it on every push to main with the release's
#     version; the APK it returns is attached to the GitHub release.
#   * the nightly workflow calls it on every push to `nightly` with the
#     nightly version and `write_version`: the version is written into
#     Cargo.toml on the runner instead of being checked against it, and the
#     APK goes onto the rolling `nightly` pre-release.
#
# Signing: with the four secrets ANDROID_KEYSTORE_BASE64 (the keystore file,
# base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD the APK is signed with the release key. Without them
# it is signed with a debug key made on the runner, which installs fine but
# does not update an installation signed with another key: the previous
# version has to be uninstalled first. A release wants the secrets.

on:
  # Pull requests only, for the same reason as ci.yml: the merge ref is what
  # lands, and branch protection sees to it that nothing lands unchecked.
  pull_request:
    # Not on a pull request into `nightly`: that branch gets the lighter
    # checks of nightly.yml, and this check again on its way into main.
    branches:
      - develop
      - main
    paths:
      - "src/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "packaging/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The version the APK must carry (from Cargo.toml)
        type: string
        default: ""
      write_version:
        description: Write `version` into Cargo.toml before building instead of checking that the tree carries it (nightly builds)
        type: boolean
        default: false

permissions:
  contents: read

# The workflow's own name is spelled out: in a workflow that release.yml
# calls, `github.workflow` is the caller's ("Release"), so android.yml,
# macos.yml and ios.yml would all land in one group - one runs, one waits,
# and the third to arrive cancels the one waiting.
concurrency:
  group: ${{ github.workflow }}-android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  # Android 11: the first release with "All files access"; build-apk.sh
  # passes the same number as the minimum SDK.
  ANDROID_API: 30

jobs:
  # ==========================================================================
  # Cross-compilation check
  # ==========================================================================
  check:
    name: cargo ndk check
    # Also when the release calls this workflow (a version is passed): that
    # run is on `main`, and `main` is the one place a cache can be saved
    # that every pull request can restore - a PR's own cache is visible to
    # that PR alone, so each new PR used to start this check cold. Not for
    # a nightly (`write_version`): its APK build is the proof, and its cache
    # is saved under the nightly branch anyway.
    if: github.event_name == 'pull_request' || (inputs.version != '' && !inputs.write_version)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packaging/android
          cache-bin: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # The runner image ships several NDKs; cargo-ndk takes the newest under
      # $ANDROID_HOME/ndk unless told otherwise.
      - name: cargo ndk check
        working-directory: packaging/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -P "$ANDROID_API" check

  # ==========================================================================
  # The APK
  # ==========================================================================
  # `github.event_name` is the caller's event when this workflow is called,
  # so the release is recognised by the version it passes.
  apk:
    name: Android APK
    if: github.event_name == 'workflow_dispatch' || inputs.version != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packaging/android
          cache-bin: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Check the version
        if: inputs.version != '' && !inputs.write_version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          have=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)
          if [ "$have" != "$VERSION" ]; then
            echo "::error::Cargo.toml carries $have, the release expects $VERSION"
            exit 1
          fi

      # A nightly: the caller computed the version (e.g.
      # 0.11.1-nightly.20261004T0930.g890dfc8), and build-apk.sh takes it
      # from Cargo.toml - versionName as is, versionCode from the numeric
      # part before the first `-`. After the cache step: the cache key
      # hashes Cargo.toml, and this edit is not meant to change it.
      - name: Write the version into Cargo.toml
        if: inputs.write_version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"$VERSION\"/" Cargo.toml
          grep -m1 '^version = ' Cargo.toml

      - name: Release keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RDS_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signing with the release key"
          else
            echo "ANDROID_KEYSTORE_BASE64 is not set - the APK will be signed with a debug key."
          fi

      - name: Build the APK
        shell: bash
        env:
          RDS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RDS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RDS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          # Through bash, so a checkout that lost the executable bit (a
          # commit made on Windows) still works.
          bash packaging/android/build-apk.sh

      # The package is inspected rather than run: there is no Android
      # emulator worth the minutes on a hosted runner, and what can go wrong
      # in the packaging - the wrong library name, a manifest that does not
      # match, a library compressed where the loader wants it plain, an
      # unsigned file - is all visible here.
      - name: Inspect the APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(ls packaging/android/out/rust-dicom-station-*-android-arm64.apk)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          "$tools/aapt2" dump badging "$apk" | grep -E "^(package|application-label|sdkVersion|targetSdkVersion|native-code|uses-permission)"
          unzip -l "$apk" | grep -E "lib/arm64-v8a/librust_dicom_station.so|AndroidManifest.xml|mipmap"
          "$tools/apksigner" verify --print-certs "$apk"
          # Segments aligned to 16 KB, or the library does not load on a
          # device with 16 KB pages (packaging/android/.cargo/config.toml).
          so=packaging/android/out/lib/arm64-v8a/librust_dicom_station.so
          readelf -lW "$so" | grep LOAD
          readelf -lW "$so" | grep LOAD | while read -r line; do
            align=${line##* }
            if [ "$((align))" -lt 16384 ]; then
              echo "::error::$so has a LOAD segment aligned to $align, less than 16 KB"
              exit 1
            fi
          done

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: packaging/android/out/rust-dicom-station-*-android-arm64.apk
          if-no-files-found: error
