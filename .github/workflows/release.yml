name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Written once and never read again on a fresh runner.
  CARGO_INCREMENTAL: 0

jobs:
  # ==========================================================================
  # Determine application version
  # ==========================================================================
  version:
    name: Determine version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version from Cargo.toml
        id: version
        shell: bash
        run: |
          VERSION=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version from Cargo.toml"
            exit 1
          fi

          TAG="v${VERSION}"

          echo "Version: $VERSION"
          echo "Tag:     $TAG"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check that release tag does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub Release $TAG already exists."
            echo "::error::Update the version in Cargo.toml before merging a new release into main."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Git tag $TAG already exists."
            echo "::error::Update the version in Cargo.toml before merging a new release into main."
            exit 1
          fi

          echo "Tag $TAG is available."

  # ==========================================================================
  # Windows release
  # ==========================================================================
  # The viewer and the installer are separate Cargo workspaces with separate
  # target directories, so nothing is shared by building them one after the
  # other on one runner - only the wall clock is. They are built side by side
  # instead and handed to a third job that packs them; `rds-pack` takes the
  # paths, so it does not care where they came from.
  windows-viewer:
    name: Windows viewer
    needs: version
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # `--features mcp` adds the second executable, rds-mcp.exe, which
      # rds-pack ships beside the viewer.
      - name: Build viewer
        run: cargo build --release --features mcp

      - name: Upload viewer executables
        uses: actions/upload-artifact@v4
        with:
          name: windows-viewer-exe
          path: |
            target/release/rust-dicom-station.exe
            target/release/rds-mcp.exe
          if-no-files-found: error
          retention-days: 1

  windows-setup:
    name: Windows setup binaries
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packaging/windows/installer

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packaging/windows/installer

      # Build rds-setup.exe and rds-pack.exe.
      - name: Build installer
        run: cargo build --release

      - name: Upload setup binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-exe
          path: |
            packaging/windows/installer/target/release/rds-setup.exe
            packaging/windows/installer/target/release/rds-pack.exe
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows installer
    needs: [version, windows-viewer, windows-setup]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download viewer executables
        uses: actions/download-artifact@v5
        with:
          name: windows-viewer-exe
          path: built/viewer

      - name: Download setup binaries
        uses: actions/download-artifact@v5
        with:
          name: windows-setup-exe
          path: built/setup

      # rds-pack combines rds-setup.exe with the viewer and the payload. It
      # needs no toolchain: it is one of the executables just downloaded.
      #
      # `--winget` also writes the three winget manifests for exactly this
      # file (its SHA-256, the URL it will have on the release). They are
      # attached to the release as a zip: the first submission to
      # microsoft/winget-pkgs is made from them by hand, every later one by
      # the `winget` job below.
      - name: Package Windows installer
        shell: pwsh
        run: |
          $out = "rust-dicom-station-${{ needs.version.outputs.version }}-windows-x86_64.exe"

          & built/setup/rds-pack.exe `
            --repo . `
            --app built/viewer/rust-dicom-station.exe `
            --mcp built/viewer/rds-mcp.exe `
            --setup built/setup/rds-setup.exe `
            --out $out `
            --winget winget-manifests `
            --release-date (Get-Date -AsUTC -Format yyyy-MM-dd)

          if (!(Test-Path $out)) {
            Write-Error "Expected installer not found: $out"
            exit 1
          }

          Write-Host "Created $out"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: rust-dicom-station-${{ needs.version.outputs.version }}-windows-x86_64.exe
          if-no-files-found: error

      - name: Upload winget manifests
        uses: actions/upload-artifact@v4
        with:
          name: windows-winget
          path: winget-manifests/*.yaml
          if-no-files-found: error

  # ==========================================================================
  # Linux AppImage
  # ==========================================================================
  linux:
    name: Linux AppImage
    needs: version
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libfuse2 \
            file \
            wget

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # packaging/linux/appimage/build-appimage.sh: the release build of both
      # executables, the AppDir (desktop entry, icon, the AppRun that routes
      # `mcp` to the server), linuxdeploy, and the checks - the file is
      # executable and `<image> mcp --check` starts the MCP server. Models
      # are intentionally NOT included: the application downloads them at
      # run time into ~/.local/share/RustDICOMStation/models.
      #
      # Through bash, so a checkout that lost the executable bit (a commit
      # made on Windows) still works.
      - name: Build the AppImage
        shell: bash
        run: bash packaging/linux/appimage/build-appimage.sh

      - name: Check the version
        shell: bash
        run: |
          set -euo pipefail
          test -f "packaging/linux/appimage/out/rust-dicom-station-${{ needs.version.outputs.version }}-linux-x86_64.AppImage"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: packaging/linux/appimage/out/rust-dicom-station-${{ needs.version.outputs.version }}-linux-x86_64.AppImage
          if-no-files-found: error

  # ==========================================================================
  # Snap
  # ==========================================================================
  # snap.yml builds the snap, installs and starts it on the runner, and
  # releases it to the Snap Store: to `stable`, or to the channel in the
  # repository variable SNAP_CHANNEL. Without the secret
  # SNAPCRAFT_STORE_CREDENTIALS it is built and tested but not uploaded
  # (docs/snap.md). The GitHub Release below does not wait for it.
  snap:
    name: Snap
    needs: version
    uses: ./.github/workflows/snap.yml
    with:
      channel: ${{ vars.SNAP_CHANNEL || 'stable' }}
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  # ==========================================================================
  # Android
  # ==========================================================================
  # android.yml builds the arm64-v8a APK and returns it as the `android-apk`
  # artifact, signed with the release key when the ANDROID_KEYSTORE_*
  # secrets are set and with a debug key otherwise (docs/android.md). The
  # GitHub Release waits for it, like for Windows and Linux.
  android:
    name: Android
    needs: version
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  # ==========================================================================
  # macOS
  # ==========================================================================
  # macos.yml builds one disk image per architecture - Apple Silicon and
  # Intel, both from an Apple Silicon runner, both for macOS 12 and newer -
  # and returns them as `macos-dmg-arm64` and `macos-dmg-x86_64`. Signed
  # with a Developer ID and notarised when the MACOS_* secrets are set, and
  # ad-hoc otherwise (docs/macos.md). The GitHub Release waits for it, like
  # for Windows, Linux and Android.
  macos:
    name: macOS
    needs: version
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  # ==========================================================================
  # iOS / iPadOS
  # ==========================================================================
  # ios.yml builds the .ipa (iPad and iPhone) and returns it as `ios-ipa`,
  # signed for installation when the IOS_* secrets are set and ad hoc
  # otherwise, and uploads it to TestFlight when the App Store Connect
  # secrets are set too (docs/ios.md). It also starts the app on a simulated
  # iPad and iPhone; that part never holds the release up. The GitHub
  # Release waits for the .ipa, like for the other platforms.
  ios:
    name: iOS
    needs: version
    uses: ./.github/workflows/ios.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  # ==========================================================================
  # Create GitHub Release
  # ==========================================================================
  release:
    name: Create GitHub Release
    needs:
      - version
      - windows
      - linux
      - android
      - macos
      - ios

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: windows-release
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: linux-release
          path: release

      - name: Download Android artifact
        uses: actions/download-artifact@v5
        with:
          name: android-apk
          path: release

      # Two artifacts, one per architecture - they cannot share a name,
      # because two jobs cannot write one artifact.
      - name: Download macOS artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: macos-dmg-*
          merge-multiple: true
          path: release

      - name: Download iOS artifact
        uses: actions/download-artifact@v5
        with:
          name: ios-ipa
          path: release

      - name: Download winget manifests
        uses: actions/download-artifact@v5
        with:
          name: windows-winget
          path: winget-manifests

      # Kept out of SHA256SUMS on purpose: the manifests themselves carry the
      # installer's hash, and nothing downloads them automatically.
      - name: Zip winget manifests
        shell: bash
        run: |
          set -euo pipefail
          (cd winget-manifests && zip -q "../release/rust-dicom-station-${{ needs.version.outputs.version }}-winget-manifests.zip" *.yaml)

      - name: List release files
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release

      - name: Generate SHA256 checksums
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            rust-dicom-station-*.exe \
            rust-dicom-station-*.AppImage \
            rust-dicom-station-*.apk \
            rust-dicom-station-*.dmg \
            rust-dicom-station-*.ipa \
            > SHA256SUMS

          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create \
            "${{ needs.version.outputs.tag }}" \
            release/* \
            --repo "${{ github.repository }}" \
            --title "Rust DICOM Station ${{ needs.version.outputs.version }}" \
            --generate-notes

  # ==========================================================================
  # Homebrew
  # ==========================================================================
  # Writes the cask for this version - one file covering both architectures,
  # with the checksums taken from the release's own SHA256SUMS - attaches it
  # to the release, and commits it to the tap named by the repository
  # variable HOMEBREW_TAP (`owner/homebrew-something`) when the secret
  # HOMEBREW_TAP_TOKEN is set.
  #
  # Without either the job only says so and succeeds, so a release is never
  # held up by it; the cask is still attached to the release, which is
  # enough for `brew install --cask ./rust-dicom-station.rb`
  # (docs/macos.md#homebrew).
  homebrew:
    name: Homebrew cask
    needs:
      - version
      - release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      HOMEBREW_TAP: ${{ vars.HOMEBREW_TAP }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The release is the source of the checksums rather than the artifacts:
      # what a user downloads is the file on the release, and a cask whose
      # hash does not match it fails for everyone.
      - name: Write the cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir .

          sha_of() {
            awk -v want="$1" '$2 == want { print $1 }' SHA256SUMS
          }
          arm=$(sha_of "rust-dicom-station-$VERSION-macos-arm64.dmg")
          intel=$(sha_of "rust-dicom-station-$VERSION-macos-x86_64.dmg")

          if [ -z "$arm" ] || [ -z "$intel" ]; then
            echo "::error::SHA256SUMS has no entry for one of the disk images"
            cat SHA256SUMS
            exit 1
          fi

          bash packaging/macos/brew-cask.sh \
            --version "$VERSION" \
            --arm-sha256 "$arm" \
            --intel-sha256 "$intel" \
            --out cask/rust-dicom-station.rb

          cat cask/rust-dicom-station.rb

      - name: Attach the cask to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" cask/rust-dicom-station.rb \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: No tap, no push
        if: env.HOMEBREW_TAP == '' || env.HOMEBREW_TAP_TOKEN == ''
        run: |
          echo "HOMEBREW_TAP and/or HOMEBREW_TAP_TOKEN are not set - the cask is"
          echo "attached to the release but not pushed to a tap (docs/macos.md)."

      - name: Push the cask to the tap
        if: env.HOMEBREW_TAP != '' && env.HOMEBREW_TAP_TOKEN != ''
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/$HOMEBREW_TAP.git" tap

          mkdir -p tap/Casks
          cp cask/rust-dicom-station.rb tap/Casks/rust-dicom-station.rb

          cd tap
          git add Casks/rust-dicom-station.rb

          # --cached, not a plain `git diff`: the very first cask is an
          # untracked file, which a working-tree diff does not see at all -
          # the job would report "nothing to push" and push nothing, for
          # ever.
          if git diff --cached --quiet; then
            echo "the tap already carries this cask - nothing to push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "rust-dicom-station $VERSION"
          # `origin HEAD` rather than a bare push: a tap that was created
          # empty has no upstream for its first branch.
          git push origin HEAD

  # ==========================================================================
  # winget
  # ==========================================================================
  # Opens the pull request that adds this version to microsoft/winget-pkgs,
  # so `winget upgrade` offers it. Needs a classic personal access token with
  # the `public_repo` scope, saved as the repository secret WINGET_TOKEN, and
  # a fork of microsoft/winget-pkgs under the same account.
  #
  # Without the secret the job only says so and succeeds, so a release is
  # never held up by it. The action updates a package that already exists:
  # the very first version is submitted by hand from the manifests zip
  # attached to the release, and the secret is added once winget-pkgs has
  # accepted it (docs/release-versioning.md).
  winget:
    name: Submit to winget
    needs:
      - version
      - release
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

    steps:
      - name: No token, no submission
        if: env.WINGET_TOKEN == ''
        run: echo "WINGET_TOKEN is not set - skipping the winget submission."

      - name: Submit the new version to winget-pkgs
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: RDS.RustDICOMStation
          version: ${{ needs.version.outputs.version }}
          release-tag: ${{ needs.version.outputs.tag }}
          installers-regex: '-windows-x86_64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
