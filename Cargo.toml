[package]
name = "rust-dicom-station"
version = "0.7.8"
edition = "2021"
description = "Fast, robust DICOM / RT DICOM viewer in pure Rust (CT/MR volumes, RTSTRUCT, RTDOSE, RTPLAN) with a three-view MPR layout"
license = "MIT"
repository = "https://github.com/alexprotom/rust-dicom-station"

[dependencies]
anyhow = "1.0"
dicom-core = "0.10"
dicom-dictionary-std = "0.10"
dicom-object = "0.10"
dicom-pixeldata = { version = "0.10", features = ["native", "rayon"] }
dicom-transfer-syntax-registry = "0.10"  # read data sets that carry no file meta group (see dicomfile.rs)
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.36"
rayon = "1.12"
rfd = "0.17"
walkdir = "2.5"
# ---- auto-segmentation (TotalSegmentator re-implementation, pure Rust) ----
gemm = "0.18"                       # pure-Rust SIMD GEMM kernels (CPU conv engine)
serde_json = "1"                    # nnU-Net plans.json, CLIP vocab.json
zip = { version = "2", default-features = false, features = ["deflate"] }
# weight download - rustls (pure Rust TLS) with the OS trust store, so
# corporate/clinical TLS-inspection proxies with custom CAs work
ureq = { version = "2", features = ["native-certs"] }
safetensors = "0.8"                 # converted-weight cache format
# Neural-network backend. Always compiled: the MedSAM2 engine is written once
# against a `burn` backend and falls back to the pure-Rust `ndarray` one when
# there is no usable GPU adapter. The `gpu` feature adds the wgpu backend
# (Vulkan / DX12 / Metal - no CUDA toolkit needed), which SegVol's image
# encoder also uses.
burn = { version = "0.21", default-features = false, features = ["std", "ndarray"] }

# The Windows executable's icon resource (see `build.rs`). Host-gated: on a
# Linux or macOS build the crate is never fetched and the script is a no-op.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["gpu"]
gpu = ["burn/wgpu", "burn/fusion", "burn/autotune"]

[profile.release]
opt-level = 3
lto = "thin"
panic = "unwind"

# Fast enough for interactive use even in debug builds
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
